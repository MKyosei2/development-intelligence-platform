global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dip-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  - job_name: dip-analysis
    metrics_path: /metrics
    static_configs:
      - targets: ["python-analysis:8100"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
