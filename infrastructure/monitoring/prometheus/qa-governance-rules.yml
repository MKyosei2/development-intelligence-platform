groups:
  - name: dip-qa-governance
    rules:
      - alert: DipQaSelfHealthDegraded
        expr: max by (status) (dip_qa_self_health{status!="Healthy"}) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "DIP QA self-health is not Healthy"
      - alert: DipQaSandboxDenials
        expr: sum(increase(dip_qa_sandbox_denied_total[15m])) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "QA sandbox denied one or more executions"
      - alert: DipQaNoGoDetected
        expr: sum(increase(dip_qa_runs_total{gate="NoGo"}[15m])) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "A QA governance release gate returned NO-GO"
