receivers:
  prometheus:
    config:
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: dip-api
          metrics_path: /metrics
          static_configs:
            - targets: ["api:8080"]
        - job_name: dip-analysis
          metrics_path: /metrics
          static_configs:
            - targets: ["python-analysis:8100"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
