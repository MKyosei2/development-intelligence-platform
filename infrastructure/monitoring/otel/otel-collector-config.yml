receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: dip-api
          metrics_path: /metrics
          static_configs:
            - targets: ["api:8080"]
        - job_name: dip-worker
          metrics_path: /metrics
          static_configs:
            - targets: ["worker:9091"]
        - job_name: dip-analysis
          metrics_path: /metrics
          static_configs:
            - targets: ["python-analysis:8100"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
