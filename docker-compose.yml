name: development-intelligence-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dip}
      POSTGRES_USER: ${POSTGRES_USER:-dip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dip-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dip} -d ${POSTGRES_DB:-dip}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [dip-network]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dip-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [dip-network]

  # Artifact storage is optional for the P0 MVP execution path.
  # Start it with: docker compose --profile storage up -d
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dipadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dip-local-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - dip-minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dip-network]

volumes:
  dip-postgres-data:
  dip-redis-data:
  dip-minio-data:

networks:
  dip-network:
    driver: bridge
