name: development-intelligence-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dip}
      POSTGRES_USER: ${POSTGRES_USER:-dip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dip-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dip} -d ${POSTGRES_DB:-dip}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [dip-network]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dip-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [dip-network]

  python-analysis:
    build:
      context: .
      dockerfile: infrastructure/docker/analysis.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${ANALYSIS_APP_ENV:-development}
      LOG_LEVEL: ${ANALYSIS_LOG_LEVEL:-INFO}
      API_KEY: ${DIP_ANALYSIS_API_KEY:-}
    ports:
      - "${ANALYSIS_PORT:-8100}:8100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [dip-network]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-dip};Username=${POSTGRES_USER:-dip};Password=${POSTGRES_PASSWORD:-dip-local-password}
      Redis__ConnectionString: redis:6379
      Redis__InstanceName: "dip:"
      AnalysisService__BaseUrl: http://python-analysis:8100
      AnalysisService__TimeoutSeconds: ${ANALYSIS_TIMEOUT_SECONDS:-30}
      GitHub__WebhookSecret: ${DIP_GITHUB_WEBHOOK_SECRET:-local-development-webhook-secret}
      GitHub__Token: ${DIP_GITHUB_TOKEN:-}
      GitHub__AppId: ${DIP_GITHUB_APP_ID:-0}
      GitHub__InstallationId: ${DIP_GITHUB_APP_INSTALLATION_ID:-0}
      GitHub__AppSlug: ${DIP_GITHUB_APP_SLUG:-}
      GitHub__AppPrivateKeyBase64: ${DIP_GITHUB_APP_PRIVATE_KEY_BASE64:-}
      Qa__WorkspaceRoot: /data/dip-workspaces
      Artifacts__Provider: Local
      Artifacts__LocalRoot: /data/dip-artifacts
      Authentication__RequireAuthenticatedUser: ${DIP_REQUIRE_AUTHENTICATION:-false}
      Authentication__GitHub__ClientId: ${DIP_GITHUB_OAUTH_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${DIP_GITHUB_OAUTH_CLIENT_SECRET:-}
      Authentication__GitHub__AdminLogins__0: ${DIP_GITHUB_ADMIN_LOGIN:-}
      Authentication__WebCallbackUrl: http://localhost:${WEB_PORT:-5081}/auth/callback
      SystemStatus__WorkerMetricsUrl: http://worker:9091/metrics
      Authentication__Jwt__Issuer: development-intelligence-platform
      Authentication__Jwt__Audience: development-intelligence-platform
      Authentication__Jwt__SigningKey: ${DIP_JWT_SIGNING_KEY:-}
      Authentication__Jwt__LifetimeMinutes: ${DIP_JWT_LIFETIME_MINUTES:-60}
    volumes:
      - dip-artifact-data:/data/dip-artifacts
      - dip-workspace-data:/data/dip-workspaces
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-analysis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [dip-network]

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-dip};Username=${POSTGRES_USER:-dip};Password=${POSTGRES_PASSWORD:-dip-local-password}
      Redis__ConnectionString: redis:6379
      Redis__InstanceName: "dip:"
      AnalysisService__BaseUrl: http://python-analysis:8100
      AnalysisService__TimeoutSeconds: ${ANALYSIS_TIMEOUT_SECONDS:-30}
      GitHub__Token: ${DIP_GITHUB_TOKEN:-}
      GitHub__AppId: ${DIP_GITHUB_APP_ID:-0}
      GitHub__InstallationId: ${DIP_GITHUB_APP_INSTALLATION_ID:-0}
      GitHub__AppSlug: ${DIP_GITHUB_APP_SLUG:-}
      GitHub__AppPrivateKeyBase64: ${DIP_GITHUB_APP_PRIVATE_KEY_BASE64:-}
      Qa__WorkspaceRoot: /data/dip-workspaces
      Artifacts__Provider: Local
      Artifacts__LocalRoot: /data/dip-artifacts
      OperationalMetrics__Port: 9091
      AutomaticTriage__IntervalSeconds: ${DIP_AUTOMATIC_TRIAGE_INTERVAL_SECONDS:-30}
      GameReplay__WorkspaceRoot: /app
      GameReplay__AllowPathLookup: ${DIP_REPLAY_ALLOW_PATH_LOOKUP:-false}
      ReleaseProvenance__AllowedRoot: /app
    volumes:
      - dip-artifact-data:/data/dip-artifacts
      - dip-workspace-data:/data/dip-workspaces
    ports:
      - "${WORKER_METRICS_PORT:-9091}:9091"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [dip-network]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080/
      Api__PublicBaseUrl: http://localhost:${API_PORT:-5080}/
      Ui__PublicWebUrl: http://127.0.0.1:${WEB_PORT:-5081}
      Ui__PublicApiUrl: http://127.0.0.1:${API_PORT:-5080}
      Ui__PublicAnalysisUrl: http://127.0.0.1:${ANALYSIS_PORT:-8100}
      Ui__PublicWorkerMetricsUrl: http://127.0.0.1:${WORKER_METRICS_PORT:-9091}
      Authentication__RequireAuthenticatedUser: ${DIP_REQUIRE_AUTHENTICATION:-false}
    ports:
      - "${WEB_PORT:-5081}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [dip-network]

volumes:
  dip-postgres-data:
  dip-redis-data:
  dip-artifact-data:
  dip-workspace-data:

networks:
  dip-network:
    driver: bridge

