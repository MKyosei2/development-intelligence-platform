<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Development Intelligence Platform architecture</title>
<desc id="desc">Browser and Caddy route to Web and API. API coordinates PostgreSQL, Redis, Worker and Python Analysis. External engineering and management sources provide evidence.</desc>
<defs><style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#14213d}.title{font-size:36px;font-weight:700}.sub{font-size:18px;fill:#4b5563}.h{font-size:22px;font-weight:700}.b{font-size:17px}.box{fill:#ffffff;stroke:#64748b;stroke-width:2}.core{fill:#eef2ff;stroke:#4f46e5}.data{fill:#ecfdf5;stroke:#059669}.src{fill:#fff7ed;stroke:#ea580c}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 8}.note{font-size:15px;fill:#475569}
