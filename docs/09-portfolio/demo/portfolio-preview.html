<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIP Portfolio Preview</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#e5edf7;background:#0b1020}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1020,#111b35);min-height:900px}.app{display:grid;grid-template-columns:220px 1fr;min-height:900px}.side{border-right:1px solid #283657;padding:30px 20px;background:#0c1327}.brand{font-weight:800;font-size:22px}.badge{font-size:11px;background:#23355c;border:1px solid #4f6ba2;border-radius:999px;padding:4px 8px;margin-top:10px;display:inline-block}.nav{margin-top:36px;display:grid;gap:10px}.nav div{padding:11px 12px;border-radius:9px;color:#8ea4ca}.nav .active{background:#1c2b50;color:#fff}.main{padding:34px 42px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#7ea6ff}.top{display:flex;align-items:flex-end;justify-content:space-between}.top h1{font-size:34px;margin:6px 0}.sample{font-size:12px;color:#ffd38b;border:1px solid #785d2a;border-radius:8px;padding:7px 10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}.card,.panel{background:rgba(20,31,57,.86);border:1px solid #2a3b62;border-radius:14px}.card{padding:18px}.card span{font-size:12px;color:#8da1c6}.card strong{display:block;font-size:27px;margin-top:8px}.ok{color:#7ee787}.warn{color:#ffd38b}.bad{color:#ff8c8c}.row{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}.panel{padding:18px}.panel h3{margin:0 0 15px}.item{display:flex;justify-content:space-between;border-top:1px solid #263657;padding:13px 0}.item:first-of-type{border-top:0}.item small{display:block;color:#8095bb;margin-top:4px}.pill{padding:5px 8px;border-radius:7px;background:#25375f;height:min-content;font-size:12px}.bar{height:8px;border-radius:8px;background:#1d2943;margin-top:8px;overflow:hidden}.fill{height:100%;background:#6596ff}.footer{margin-top:18px;color:#6880aa;font-size:12px}</style></head><body><div class="app"><aside class="side"><div class="brand">DIP</div><div class="badge">Development Intelligence</div><div class="nav"><div>Overview</div><div class="active" id="n1">Project Intelligence</div><div id="n2">QA / Defects</div><div id="n3">Management</div><div>Repository / CI</div><div>Sources</div></div></aside><main class="main"><div class="top"><div><div class="eyebrow" id="eye">Evidence-backed delivery</div><h1 id="title">Project Intelligence</h1></div><div class="sample">SAMPLE PORTFOLIO DATA</div></div><div class="grid" id="metrics"></div><div class="row"><section class="panel"><h3 id="leftTitle"></h3><div id="left"></div></section><section class="panel"><h3 id="rightTitle"></h3><div id="right"></div></section></div><div class="footer">Deterministic reviewer preview · runtime verification is stored separately and bound to an exact commit.</div></main></div><script>
const views={
 intelligence:{eye:'Evidence-backed delivery',title:'Project Intelligence',nav:'n1',metrics:[['Health','91','ok'],['Evidence progress','78%','ok'],['Reported progress','86%','warn'],['Open blockers','2','warn']],leftTitle:'Plan vs actual',left:[['Gameplay milestone','Evidence 82% · Reported 90%','Confirmed'],['Server integration','Evidence 61% · Reported 85%','Gap'],['Console performance','Evidence 73% · Reported 73%','Confirmed'],['Release candidate','3 gates remaining','At risk']],rightTitle:'Decision brief',right:[['Release readiness','Hold until server E2E recovers','High'],['Change risk','Save-data migration touched','Medium'],['Next action','Re-run impacted suites','Today']]},
 qa:{eye:'Defect intelligence',title:'QA / Defect Intelligence',nav:'n2',metrics:[['Open findings','14','warn'],['Critical','1','bad'],['Reproduced','9/9','ok'],['False positives','0/7','ok']],leftTitle:'Evidence-ranked findings',left:[['SaveData migrator','Regression origin narrowed to PR #184','Critical'],['Unity scene','Missing serialized reference','High'],['Native worker','Allocator growth reproduced','High'],['Shader variant','Baseline mismatch; waiver expires Fri','Medium']],rightTitle:'Verification',right:[['QA Bug Zoo','19/19 detected','100%'],['Reproduction','9/9 stable fingerprints','100%'],['Clean controls','0 false positives','PASS']]},
 management:{eye:'Detect → decide → verify',title:'Management Operations',nav:'n3',metrics:[['Health','91','ok'],['Do now','4','warn'],['Approvals','2','warn'],['Sync conflicts','1','warn']],leftTitle:'Do now',left:[['Release approval','Tech Lead evidence required','Critical'],['Risk R-17','Network regression may move milestone','High'],['Action A-42','Owner: Rendering · Due today','High'],['Scope SC-08','Review schedule + QA impact','Medium']],rightTitle:'Meeting mode',right:[['Decision','Ship blocker remains unresolved','Now'],['Capacity','Shared QA pool at 92%','Review'],['Follow-up','Verify build after hotfix','Today']]}
};
function item(x){return `<div class="item"><div><strong>${x[0]}</strong><small>${x[1]}</small></div><span class="pill">${x[2]}</span></div>`}
const key=new URLSearchParams(location.search).get('view')||'intelligence',v=views[key]; document.getElementById('eye').textContent=v.eye; document.getElementById('title').textContent=v.title;['n1','n2','n3'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(v.nav).classList.add('active');document.getElementById('metrics').innerHTML=v.metrics.map(x=>`<div class="card"><span>${x[0]}</span><strong class="${x[2]}">${x[1]}</strong><div class="bar"><div class="fill" style="width:${Math.min(100,parseInt(x[1])||70)}%"></div></div></div>`).join(''); document.getElementById('leftTitle').textContent=v.leftTitle;document.getElementById('left').innerHTML=v.left.map(item).join('');document.getElementById('rightTitle').textContent=v.rightTitle;document.getElementById('right').innerHTML=v.right.map(item).join('');
</script></body></html>
