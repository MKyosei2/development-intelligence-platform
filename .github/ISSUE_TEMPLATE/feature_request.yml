name: Feature request
description: Propose a new capability or an improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Describe the user problem first. Implementation ideas are welcome, but expected value must be clear.
  - type: dropdown
    id: user
    attributes:
      label: Primary user
      options: [Project manager, Producer, Tech lead, Engineer, Technical artist, Artist, Planner, Platform administrator, Other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow is slow, risky, manual, or difficult to understand?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior from the user's point of view.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Expected value
      description: Explain the improvement in quality, speed, visibility, or risk reduction.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options: [Low, Medium, High, Critical]
    validations:
      required: true
