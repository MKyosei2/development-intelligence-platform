name: Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GitHub dependency review
        if: vars.DEPENDENCY_REVIEW_ENABLED == 'true'
        uses: actions/dependency-review-action@v4

      - name: Set up .NET fallback audit
        if: vars.DEPENDENCY_REVIEW_ENABLED != 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Review NuGet dependencies (fallback)
        if: vars.DEPENDENCY_REVIEW_ENABLED != 'true'
        shell: pwsh
        run: |
          dotnet restore DevelopmentIntelligencePlatform.sln
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed." }
          $output = dotnet list DevelopmentIntelligencePlatform.sln package --vulnerable --include-transitive 2>&1 | Out-String
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "NuGet dependency review failed." }
          if ($output -match "has the following vulnerable packages") { throw "Vulnerable NuGet package(s) detected." }

      - name: Set up Python fallback audit
        if: vars.DEPENDENCY_REVIEW_ENABLED != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/python-analysis/requirements.txt

      - name: Review Python dependencies (fallback)
        if: vars.DEPENDENCY_REVIEW_ENABLED != 'true'
        working-directory: services/python-analysis
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r requirements.txt

  dotnet-audit:
    name: .NET dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DevelopmentIntelligencePlatform.sln
      - name: Fail on vulnerable NuGet packages
        shell: pwsh
        run: |
          $output = dotnet list DevelopmentIntelligencePlatform.sln package --vulnerable --include-transitive 2>&1 | Out-String
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet package vulnerability audit failed."
          }
          if ($output -match "has the following vulnerable packages") {
            throw "Vulnerable NuGet package(s) detected."
          }

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/python-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/python-analysis/requirements.txt
      - name: Audit requirements
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r requirements.txt

  secret-scan:
    name: Secret scan
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: vars.CODEQL_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, python, cpp]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
