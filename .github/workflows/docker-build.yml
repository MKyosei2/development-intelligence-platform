name: Native Package Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"
      - ".portfolio-ci-trigger"
permissions: { contents: read }
jobs:
  native-package:
    name: Exact-SHA native release package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Restore and test
        run: |
          dotnet restore DevelopmentIntelligencePlatform.sln
          dotnet build DevelopmentIntelligencePlatform.sln -c Release --no-restore
          dotnet test tests/Dip.Domain.Tests/Dip.Domain.Tests.csproj -c Release --no-build
          dotnet test tests/Dip.Application.Tests/Dip.Application.Tests.csproj -c Release --no-build
          dotnet test tests/Dip.Infrastructure.Tests/Dip.Infrastructure.Tests.csproj -c Release --no-build
      - name: Publish native services
        run: |
          mkdir -p artifacts/native-release
          dotnet publish src/Dip.Api/Dip.Api.csproj -c Release -o artifacts/native-release/api --no-restore
          dotnet publish src/Dip.Worker/Dip.Worker.csproj -c Release -o artifacts/native-release/worker --no-restore
          dotnet publish src/Dip.Web/Dip.Web.csproj -c Release -o artifacts/native-release/web --no-restore
          cp -a services/python-analysis artifacts/native-release/python-analysis
          cp -a deploy artifacts/native-release/deploy
          cp -a scripts artifacts/native-release/scripts
      - name: Build migration bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle --project src/Dip.Infrastructure --startup-project src/Dip.Api --configuration Release --output artifacts/native-release/dip-migrate
          chmod +x artifacts/native-release/dip-migrate
      - name: Record exact-revision provenance
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/native-release
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          printf '{"schema":"dip-native-release-v1","sourceCommit":"%s","builtAtUtc":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release-manifest.json
          tar -czf ../dip-native-${GITHUB_SHA}.tar.gz .
          cd ..
          sha256sum dip-native-${GITHUB_SHA}.tar.gz > dip-native-${GITHUB_SHA}.sha256
      - name: Verify native package before upload
        shell: bash
        run: |
          set -euo pipefail
          test -s "artifacts/dip-native-${GITHUB_SHA}.tar.gz"
          test -s "artifacts/dip-native-${GITHUB_SHA}.sha256"
          cd artifacts
          sha256sum -c "dip-native-${GITHUB_SHA}.sha256"
          tar -tzf "dip-native-${GITHUB_SHA}.tar.gz" >/dev/null
      - name: Upload exact-SHA native package
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dip-native-${{ github.sha }}
          path: |
            artifacts/dip-native-${{ github.sha }}.tar.gz
            artifacts/dip-native-${{ github.sha }}.sha256
          if-no-files-found: error
          retention-days: 3
