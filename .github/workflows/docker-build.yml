name: Docker Build

# DIP uses local CI to avoid GitHub-hosted runner usage.
#
# Automatic push / pull_request execution is intentionally disabled.
# Run:
#
#   Verify-Local-CI.cmd
#
# or:
#
#   Verify-Local-CI-Full.cmd
#
# on a development machine instead.

on:
  workflow_dispatch:

jobs:
  local-ci-only:
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Local CI notice
        run: echo "DIP uses local CI validation."