name: Docker Build

on:
  pull_request:
    branches: [main, develop]
    paths:
      - ".portfolio-ci-trigger"
      - "src/**"
      - "services/**"
      - "collectors/native-collector/**"
      - "infrastructure/docker/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/dip

jobs:
  build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, dockerfile: infrastructure/docker/api.Dockerfile, image: api}
          - {name: web, dockerfile: infrastructure/docker/web.Dockerfile, image: web}
          - {name: worker, dockerfile: infrastructure/docker/worker.Dockerfile, image: worker}
          - {name: analysis, dockerfile: infrastructure/docker/analysis.Dockerfile, image: analysis}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
