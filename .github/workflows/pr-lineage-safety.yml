name: PR Lineage Safety

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-lineage-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linear-history:
    name: Reject non-linear PR history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify pull request lineage
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "base=$BASE_SHA"
          echo "head=$HEAD_SHA"
          echo "tested_merge=${GITHUB_SHA}"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          merge_commits="$(git rev-list --merges "${BASE_SHA}..${HEAD_SHA}")"
          if [ -n "$merge_commits" ]; then
            echo "::error::Non-linear PR history detected. Do not merge a feature branch into itself or merge divergent copies of the same feature branch. Rebase/reset onto the known-good lineage instead."
            echo "Merge commits inside PR range:"
            while IFS= read -r sha; do
              [ -z "$sha" ] && continue
              git show --no-patch --format='  %H %s' "$sha"
            done <<< "$merge_commits"
            exit 1
          fi

          echo "PASS: PR head history is linear relative to its base."

      - name: Verify GitHub integrated revision is checked out
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          parents="$(git show -s --format=%P "$GITHUB_SHA")"
          case " $parents " in
            *" $HEAD_SHA "*) ;;
            *)
              echo "::error::The checked-out PR revision does not contain the advertised head SHA as a merge parent. CI must validate GitHub's integrated PR revision, not an unrelated revision."
              echo "GITHUB_SHA=$GITHUB_SHA"
              echo "parents=$parents"
              exit 1
              ;;
          esac

          echo "PASS: workflow is validating GitHub's integrated pull-request revision $GITHUB_SHA."
