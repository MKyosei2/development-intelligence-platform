name: PR Lineage Safety

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch used for lineage verification"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: pr-lineage-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linear-history:
    name: Verify selected branch lineage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}" --no-tags

      - name: Reject merge commits inside branch range
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git merge-base HEAD "origin/${BASE_REF}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          MERGES="$(git rev-list --merges "${BASE_SHA}..${HEAD_SHA}")"
          echo "base_ref=${BASE_REF}"
          echo "base_sha=${BASE_SHA}"
          echo "head_sha=${HEAD_SHA}"
          if [ -n "${MERGES}" ]; then
            echo "::error::Non-linear branch history detected."
            echo "${MERGES}"
            exit 1
          fi
          echo "PASS: branch history is linear relative to ${BASE_REF}."

      - name: Validate commit subjects
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git merge-base HEAD "origin/${BASE_REF}")"
          git log "${BASE_SHA}..HEAD" --format=%s | python tools/validate_commit_message.py
