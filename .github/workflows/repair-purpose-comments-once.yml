name: One-time strict malformed Purpose repair

on:
  push:
    branches:
      - fix/purpose-comments-normalization-20260925

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/purpose-comments-normalization-20260925
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Repair malformed Purpose comments
        run: python scripts/repair_purpose_comments_once.py

      - name: Verify no malformed Purpose comments remain
        run: python scripts/repair_purpose_comments_once.py --check

      - name: Verify patch integrity
        run: git diff --check

      - name: Remove one-time repair machinery
        run: |
          git rm .github/workflows/repair-purpose-comments-once.yml
          git rm scripts/repair_purpose_comments_once.py

      - name: Commit repaired Purpose comments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair malformed purpose comments"
          git push origin HEAD:fix/purpose-comments-normalization-20260925
