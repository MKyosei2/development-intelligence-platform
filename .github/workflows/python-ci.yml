name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".portfolio-ci-trigger"

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis-service:
    name: Test Python analysis service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/python-analysis
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/python-analysis/requirements.txt
            services/python-analysis/requirements-dev.txt
            services/python-analysis/pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import smoke test
        run: |
          python -c "import app; import app.main; print(app.__file__)"

      - name: Compile check
        run: python -m compileall app tests

      - name: Test
        run: python -m pytest --junitxml=python-test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results
          path: services/python-analysis/python-test-results.xml
          if-no-files-found: warn
          retention-days: 14

  maya-collector-smoke:
    name: Maya collector dependency-free validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Maya collector and tests
        run: python -m compileall collectors/maya-collector/dip_maya_collector collectors/maya-collector/tests
      - name: Import Maya-independent contracts
        working-directory: collectors/maya-collector
        run: |
          python -c "from dip_maya_collector import models; from dip_maya_collector.reporting import report_writer; print('Maya-independent contracts import successfully')"
      - name: Dependency-free Maya collector unit tests
        working-directory: collectors/maya-collector
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Confirm Maya runtime boundary is explicit
        working-directory: collectors/maya-collector
        run: |
          python - <<'PYBOUNDARY'
          from pathlib import Path
          text = Path('dip_maya_collector/main.py').read_text(encoding='utf-8')
          assert 'import maya.cmds as cmds' in text
          assert 'Run this collector inside Autodesk Maya or mayapy.' in text
          print('PASS: hosted CI validates Maya-independent behavior without pretending to provide Maya runtime verification.')
          PYBOUNDARY

  portfolio-evidence-tooling:
    name: Validate exact-revision evidence tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install evidence-tooling test dependency
        run: python -m pip install pytest
      - name: Compile portfolio evidence tools
        run: |
          python -m py_compile \
            tools/verify_final_ci_matrix.py \
            tools/verify_unity_real_project.py \
            tools/verify_unreal_real_project.py \
            tools/publish_real_project_evidence.py \
            tools/finalize_portfolio_evidence.py
      - name: CLI smoke
        run: |
          python tools/verify_final_ci_matrix.py --help >/dev/null
          python tools/verify_unity_real_project.py --help >/dev/null
          python tools/verify_unreal_real_project.py --help >/dev/null
          python tools/publish_real_project_evidence.py --help >/dev/null
          python tools/finalize_portfolio_evidence.py --help >/dev/null
      - name: Fail-closed evidence regression tests
        run: python -m pytest tools/tests/test_portfolio_evidence_tools.py -q --junitxml=portfolio-evidence-tooling-tests.xml
      - name: Upload evidence-tooling tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-evidence-tooling-tests
          path: portfolio-evidence-tooling-tests.xml
          if-no-files-found: warn
          retention-days: 14
