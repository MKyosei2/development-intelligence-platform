name: Python CI

on:
  push:
    branches: [main, develop]
    paths:
      - ".portfolio-ci-trigger"
      - "services/python-analysis/**"
      - "collectors/maya-collector/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - ".portfolio-ci-trigger"
      - "services/python-analysis/**"
      - "collectors/maya-collector/**"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis-service:
    name: Test Python analysis service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/python-analysis
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/python-analysis/requirements.txt
            services/python-analysis/requirements-dev.txt
            services/python-analysis/pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import smoke test
        run: |
          python -c "import app; import app.main; print(app.__file__)"

      - name: Compile check
        run: python -m compileall app tests

      - name: Test
        run: python -m pytest --junitxml=python-test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results
          path: services/python-analysis/python-test-results.xml
          if-no-files-found: warn
          retention-days: 14
