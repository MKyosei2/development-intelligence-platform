name: Commit Message
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"
      - ".portfolio-ci-trigger"
permissions:
  contents: read
jobs:
  conventional-subjects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate commit subjects
        shell: bash
        run: |
          git log -1 --format=%s | python tools/validate_commit_message.py
