name: Integration and E2E Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".portfolio-ci-trigger"
permissions: { contents: read }
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: Native PostgreSQL, API, Worker and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: dip_test
      POSTGRES_USER: dip
      POSTGRES_PASSWORD: dip-test-password
      ConnectionStrings__PostgreSql: Host=127.0.0.1;Port=5432;Database=dip_test;Username=dip;Password=dip-test-password
      ASPNETCORE_ENVIRONMENT: Testing
      DOTNET_ENVIRONMENT: Testing
      ASPNETCORE_URLS: http://127.0.0.1:7001
      Authentication__RequireAuthenticatedUser: "false"
      GitHub__WebhookSecret: integration-test-secret
      GitHub__Token: integration-test-token
      DIP_API_URL: http://127.0.0.1:7001
      Qa__WorkspaceRoot: ${{ github.workspace }}
      Qa__ArtifactRoot: ${{ github.workspace }}/artifacts/qa
      Artifacts__Provider: Local
      Artifacts__LocalRoot: ${{ github.workspace }}/artifacts/durable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "8.0.x" }
      - name: Prepare native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql
          sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='dip'" | grep -q 1 || sudo -u postgres psql -c "CREATE ROLE dip LOGIN PASSWORD 'dip-test-password' CREATEDB;"
          sudo -u postgres dropdb --if-exists dip_test
          sudo -u postgres createdb -O dip dip_test
      - name: Restore and build
        run: |
          dotnet restore DevelopmentIntelligencePlatform.sln
          dotnet build DevelopmentIntelligencePlatform.sln -c Release --no-restore
      - name: API integration tests
        run: dotnet test tests/Dip.IntegrationTests/Dip.IntegrationTests.csproj -c Release --no-build --logger "trx;LogFileName=integration-tests.trx" --results-directory TestResults
      - name: Start native API and Worker
        shell: bash
        run: |
          dotnet run --no-launch-profile --project src/Dip.Api/Dip.Api.csproj -c Release --no-build --no-restore > api.log 2>&1 & echo $! > api.pid
          dotnet run --no-launch-profile --project src/Dip.Worker/Dip.Worker.csproj -c Release --no-build --no-restore > worker.log 2>&1 & echo $! > worker.pid
          for attempt in {1..60}; do curl --fail --silent http://127.0.0.1:7001/health >/dev/null && exit 0; kill -0 "$(cat api.pid)" || { cat api.log; exit 1; }; sleep 1; done
          cat api.log; exit 1
      - name: Live end-to-end tests
        run: dotnet test tests/Dip.EndToEndTests/Dip.EndToEndTests.csproj -c Release --no-build --logger "trx;LogFileName=e2e-tests.trx" --results-directory TestResults
      - name: Upload evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: integration-e2e-results
          path: |
            TestResults
            api.log
            worker.log
            artifacts/qa
          if-no-files-found: warn
          retention-days: 3
      - name: Stop native processes
        if: always()
        run: |
          test -f api.pid && kill $(cat api.pid) || true
          test -f worker.pid && kill $(cat worker.pid) || true
