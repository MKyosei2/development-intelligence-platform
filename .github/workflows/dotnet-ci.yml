name: .NET CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".portfolio-ci-trigger"

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build solution and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Source readability
        shell: pwsh
        run: ./scripts/Verify-SourceReadability.ps1 -Strict
      - name: Restore
        run: dotnet restore DevelopmentIntelligencePlatform.sln
      - name: Build
        run: dotnet build DevelopmentIntelligencePlatform.sln --configuration Release --no-restore
      - name: Domain tests
        run: dotnet test tests/Dip.Domain.Tests/Dip.Domain.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=domain-tests.trx" --collect "XPlat Code Coverage" --results-directory TestResults
      - name: Application tests
        run: dotnet test tests/Dip.Application.Tests/Dip.Application.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=application-tests.trx" --collect "XPlat Code Coverage" --results-directory TestResults
      - name: Infrastructure tests
        run: dotnet test tests/Dip.Infrastructure.Tests/Dip.Infrastructure.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=infrastructure-tests.trx" --collect "XPlat Code Coverage" --results-directory TestResults
      - name: Project Truth / Release / QA coverage gates
        run: python tools/check_core_coverage.py --results TestResults --minimum 50
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-unit-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
