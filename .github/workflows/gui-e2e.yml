name: GUI E2E

on:
  push:
    branches: [main, master]
    paths:
      - ".portfolio-ci-trigger"
      - "src/**"
      - "tests/Dip.UiE2E/**"
      - "scripts/Verify-GuiRuntime.ps1"
      - "infrastructure/docker/**"
      - "docker-compose*.yml"
      - ".github/workflows/gui-e2e.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - ".portfolio-ci-trigger"
      - "src/**"
      - "tests/Dip.UiE2E/**"
      - "scripts/Verify-GuiRuntime.ps1"
      - "infrastructure/docker/**"
      - "docker-compose*.yml"
      - ".github/workflows/gui-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Isolated runtime + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DIP_REQUIRE_AUTHENTICATION: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify isolated DIP GUI stack and browser flow
        shell: pwsh
        run: ./scripts/Verify-GuiRuntime.ps1 -RunPlaywright -StartupTimeoutSeconds 900

      - name: Upload GUI runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dip-gui-runtime-${{ github.sha }}
          path: |
            artifacts/gui-runtime-verification
            tests/Dip.UiE2E/artifacts/playwright-report
            tests/Dip.UiE2E/artifacts/test-results
          if-no-files-found: warn
          retention-days: 30
