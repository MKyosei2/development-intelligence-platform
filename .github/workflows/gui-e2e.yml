name: GUI E2E
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"
      - ".portfolio-ci-trigger"
permissions: { contents: read }
concurrency:
  group: gui-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playwright:
    name: Native runtime + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: dip
      POSTGRES_USER: dip
      POSTGRES_PASSWORD: dip-gui-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/python-analysis/requirements.txt
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('tests/Dip.UiE2E/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Prepare native PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='dip'" | grep -q 1 || sudo -u postgres psql -c "CREATE ROLE dip LOGIN PASSWORD 'dip-gui-password' CREATEDB;"
          sudo -u postgres dropdb --if-exists dip
          sudo -u postgres createdb -O dip dip
      - name: Verify native DIP GUI runtime
        shell: pwsh
        run: ./scripts/Verify-GuiRuntime.ps1 -RunPlaywright -StartupTimeoutSeconds 420
      - name: Print GUI failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::group::GUI runtime verification diagnostics"
          latest="$(find artifacts/gui-runtime-verification -name FIRST_FUNCTIONAL_EXCEPTION.json -type f 2>/dev/null | sort | tail -n 1 || true)"
          if [ -n "$latest" ]; then
            echo "FIRST_FUNCTIONAL_EXCEPTION: $latest"
            cat "$latest"
          else
            echo "No FIRST_FUNCTIONAL_EXCEPTION.json was produced."
          fi
          echo
          echo "Playwright error contexts:"
          find tests/Dip.UiE2E/artifacts/test-results -name error-context.md -type f -print 2>/dev/null | while read -r file; do
            echo "----- $file -----"
            cat "$file"
          done
          echo
          echo "Playwright result files:"
          find tests/Dip.UiE2E/artifacts/test-results -maxdepth 3 -type f -print 2>/dev/null | sort || true
          echo "::endgroup::"
      - name: Upload GUI evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dip-gui-runtime-${{ github.sha }}
          path: |
            artifacts/gui-runtime-verification
            tests/Dip.UiE2E/artifacts/playwright-report
            tests/Dip.UiE2E/artifacts/test-results
          if-no-files-found: warn
          retention-days: 3
