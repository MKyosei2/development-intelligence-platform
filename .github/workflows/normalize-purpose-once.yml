name: One-time Purpose normalization
# commit normalization before final gate verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-purpose-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize semantic Purpose comments
        continue-on-error: true
        shell: pwsh
        run: ./scripts/Repair-SourcePurposeComments.ps1
      - name: Commit normalized Purpose comments
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts tools services collectors plugins
          if (git diff --cached --quiet) {
            Write-Host "No Purpose normalization changes were required."
            exit 0
          }
          git commit -m "refactor: normalize semantic purpose comments"
          git push origin HEAD:main
      - name: Verify semantic Purpose comments
        shell: pwsh
        run: ./scripts/Verify-SourceReadability.ps1 -Strict
