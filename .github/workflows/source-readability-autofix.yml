name: Source Readability Repair Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-readability-repair-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Purpose tooling regression
        shell: pwsh
        run: ./scripts/Test-SourcePurposeTooling.ps1

      - name: Apply Purpose repair in disposable runner workspace
        shell: pwsh
        run: ./scripts/Repair-SourcePurposeComments.ps1 -Apply

      - name: Restore
        run: dotnet restore DevelopmentIntelligencePlatform.sln

      - name: Format CSharp in disposable runner workspace
        run: dotnet format DevelopmentIntelligencePlatform.sln --no-restore --verbosity minimal

      - name: Report residual readability findings without rewriting them
        shell: pwsh
        run: ./scripts/Repair-SourceReadabilityResiduals.ps1 -ReportPath artifacts/source-readability/residuals.md

      - name: Build reviewable patch artifact
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/source-readability
          git diff --binary -- . ':(exclude)artifacts/**' > artifacts/source-readability/source-readability.patch
          git diff --name-only -- . ':(exclude)artifacts/**' > artifacts/source-readability/changed-files.txt

      - name: Verify strict readability after preview repair
        shell: pwsh
        run: ./scripts/Verify-SourceReadability.ps1 -Strict -ReportPath artifacts/source-readability/report.md -InventoryPath artifacts/source-readability/inventory.csv

      - name: Upload repair preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-readability-repair-preview-${{ github.sha }}
          path: artifacts/source-readability
          if-no-files-found: error
          retention-days: 14
