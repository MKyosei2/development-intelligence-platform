name: Live Native Deployment
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [".portfolio-ci-trigger", "src/**", "services/**", "scripts/**", "deploy/**", ".github/workflows/live-deploy.yml"]
  push:
    branches: [main]
    paths: [".portfolio-ci-trigger", "src/**", "services/**", "scripts/**", "deploy/**", ".github/workflows/live-deploy.yml"]
concurrency:
  group: dip-production-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: Verify deployable native revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "8.0.x" }
      - name: Exact-revision verification
        run: |
          git log -1 --pretty=%s | python tools/validate_commit_message.py
          python tools/verify_publication_safety.py --root . --output /tmp/publication-safety.json
          python tools/validate_portfolio_readiness.py --root . --output /tmp/portfolio-readiness.json
          dotnet restore DevelopmentIntelligencePlatform.sln
          dotnet build DevelopmentIntelligencePlatform.sln -c Release --no-restore
          dotnet test tests/Dip.Domain.Tests/Dip.Domain.Tests.csproj -c Release --no-build
          dotnet test tests/Dip.Application.Tests/Dip.Application.Tests.csproj -c Release --no-build
          dotnet test tests/Dip.Infrastructure.Tests/Dip.Infrastructure.Tests.csproj -c Release --no-build
      - name: Python verification
        working-directory: services/python-analysis
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -c "import app; import app.main; print(app.__file__)"
          python -m compileall app tests
          python -m pytest --junitxml=python-live-deploy-test-results.xml

  exact-gate:
    name: Require complete exact-SHA verification matrix
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Record dry-run deployment policy
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && vars.DIP_LIVE_DEPLOY_ENABLED != 'true')
        shell: bash
        run: |
          set -euo pipefail
          echo "PASS: live deployment is disabled for this event; exact-SHA deployment matrix is not required."
          echo "event=${GITHUB_EVENT_NAME}"
          echo "sha=${GITHUB_SHA}"
          {
            echo "### Live deployment policy"
            echo "- Result: PASS"
            echo "- Production mutation: disabled"
            echo "- Exact SHA: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for required workflows on this SHA
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DIP_LIVE_DEPLOY_ENABLED == 'true')
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "Commit Message" ".NET CI" "Python CI" "Native Collector CI"
            "Integration and E2E Tests" "GUI E2E" "Native Package Build"
            "Security Scan" "Universal QA Benchmark" "Unreal Collector CI"
            "Portfolio Publication Readiness"
          )
          deadline=$((SECONDS+1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
            all_green=1
            for name in "${required[@]}"; do
              status="$(jq -r --arg n "$name" '[.workflow_runs[] | select(.name==$n)][0].status // "missing"' <<<"$runs")"
              conclusion="$(jq -r --arg n "$name" '[.workflow_runs[] | select(.name==$n)][0].conclusion // ""' <<<"$runs")"
              printf '%-34s status=%-12s conclusion=%s\n' "$name" "$status" "${conclusion:-pending}"
              if [ "$status" = completed ] && [ -n "$conclusion" ] && [ "$conclusion" != success ]; then
                echo "Required workflow failed for exact SHA: $name ($conclusion)" >&2
                exit 3
              fi
              [ "$conclusion" = success ] || all_green=0
            done
            [ "$all_green" -eq 1 ] && { echo "PASS: complete exact-SHA matrix is green."; exit 0; }
            sleep 15
          done
          echo "Timed out waiting for complete exact-SHA workflow matrix." >&2
          exit 4

  package:
    name: Build exact-SHA native package
    needs: [verify, exact-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "8.0.x" }
      - name: Publish
        run: |
          dotnet restore DevelopmentIntelligencePlatform.sln
          mkdir -p artifacts/native-release
          dotnet publish src/Dip.Api/Dip.Api.csproj -c Release -o artifacts/native-release/api --no-restore
          dotnet publish src/Dip.Worker/Dip.Worker.csproj -c Release -o artifacts/native-release/worker --no-restore
          dotnet publish src/Dip.Web/Dip.Web.csproj -c Release -o artifacts/native-release/web --no-restore
          cp -a services/python-analysis artifacts/native-release/python-analysis
          cp -a scripts deploy artifacts/native-release/
          dotnet tool restore
          dotnet ef migrations bundle --project src/Dip.Infrastructure --startup-project src/Dip.Api --configuration Release --output artifacts/native-release/dip-migrate
          chmod +x artifacts/native-release/dip-migrate
          (cd artifacts/native-release && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          printf '{"schema":"dip-native-release-v1","sourceCommit":"%s"}\n' "$GITHUB_SHA" > artifacts/native-release/release-manifest.json
          tar -czf artifacts/dip-native-${GITHUB_SHA}.tar.gz -C artifacts/native-release .
          sha256sum artifacts/dip-native-${GITHUB_SHA}.tar.gz > artifacts/dip-native-${GITHUB_SHA}.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: dip-native-${{ github.sha }}
          path: |
            artifacts/dip-native-${{ github.sha }}.tar.gz
            artifacts/dip-native-${{ github.sha }}.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy native runtime and verify browser
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://${{ vars.DIP_PUBLIC_HOST }}/
    env:
      PUBLIC_HOST: ${{ vars.DIP_PUBLIC_HOST }}
      DEPLOY_HOST: ${{ secrets.DIP_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DIP_DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DIP_DEPLOY_PATH }}
      DEPLOY_HOST_KEY: ${{ secrets.DIP_DEPLOY_HOST_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DIP_DEPLOY_SSH_KEY }}
      POSTGRES_HOST: ${{ vars.DIP_POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.DIP_POSTGRES_PORT }}
      POSTGRES_DB: ${{ vars.DIP_POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.DIP_POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.DIP_POSTGRES_PASSWORD }}
      OFFSITE_DIR: ${{ vars.DIP_BACKUP_OFFSITE_DIRECTORY }}
      ANALYSIS_API_KEY: ${{ secrets.DIP_ANALYSIS_API_KEY }}
      OAUTH_CLIENT_ID: ${{ secrets.DIP_GITHUB_OAUTH_CLIENT_ID }}
      OAUTH_CLIENT_SECRET: ${{ secrets.DIP_GITHUB_OAUTH_CLIENT_SECRET }}
      ADMIN_LOGIN: ${{ vars.DIP_GITHUB_ADMIN_LOGIN }}
      JWT_SIGNING_KEY: ${{ secrets.DIP_JWT_SIGNING_KEY }}
      WEBHOOK_SECRET: ${{ secrets.DIP_GITHUB_WEBHOOK_SECRET }}
      GITHUB_INTEGRATION_TOKEN: ${{ secrets.DIP_GITHUB_TOKEN }}
    steps:
      - name: Validate deployment policy
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "${{ github.event_name }}" = "push" ] && [ "${{ vars.DIP_LIVE_DEPLOY_ENABLED }}" = "true" ]; }; then
            echo "PASS: production deployment is enabled for this event."
          else
            echo "PASS: production deployment is intentionally disabled for this event."
            echo "No production host, database, or runtime will be mutated."
          fi
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DIP_LIVE_DEPLOY_ENABLED == 'true')
      - uses: actions/download-artifact@v7
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DIP_LIVE_DEPLOY_ENABLED == 'true')
        with:
          name: dip-native-${{ github.sha }}
          path: artifacts/deploy
      - name: Validate deployment configuration
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DIP_LIVE_DEPLOY_ENABLED == 'true')
        shell: bash
        run: |
          set -euo pipefail
          required=(PUBLIC_HOST DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_HOST_KEY DEPLOY_SSH_KEY POSTGRES_HOST POSTGRES_PORT POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD OFFSITE_DIR ANALYSIS_API_KEY OAUTH_CLIENT_ID OAUTH_CLIENT_SECRET ADMIN_LOGIN JWT_SIGNING_KEY WEBHOOK_SECRET)
          for n in "${required[@]}"; do [ -n "${!n:-}" ] || { echo "Missing $n" >&2; exit 2; }; done
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 2
          [[ "$PUBLIC_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || exit 2
          [ "${#JWT_SIGNING_KEY}" -ge 64 ] && [ "${#ANALYSIS_API_KEY}" -ge 32 ]
          safe=(POSTGRES_PASSWORD ANALYSIS_API_KEY OAUTH_CLIENT_ID OAUTH_CLIENT_SECRET ADMIN_LOGIN JWT_SIGNING_KEY WEBHOOK_SECRET GITHUB_INTEGRATION_TOKEN)
          for n in "${safe[@]}"; do [[ "${!n:-}" =~ ^[A-Za-z0-9_+=./:@-]*$ ]] || { echo "$n contains characters unsafe for the SSH environment handoff." >&2; exit 2; }; done
      - name: Configure SSH
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DIP_LIVE_DEPLOY_ENABLED == 'true')
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts ~/.ssh/id_ed25519
      - name: Upload exact-SHA package
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DIP_LIVE_DEPLOY_ENABLED == 'true')
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/incoming' '$DEPLOY_PATH/releases' '$DEPLOY_PATH/data/artifacts' '$DEPLOY_PATH/data/workspaces' '$DEPLOY_PATH/backups'"
          scp "artifacts/deploy/dip-native-${GITHUB_SHA}.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/incoming/"
          scp "artifacts/deploy/dip-native-${GITHUB_SHA}.sha256" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/incoming/"
      - name: Native transactional deployment
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DIP_LIVE_DEPLOY_ENABLED == 'true')
        shell: bash
        run: |
          set -euo pipefail
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          {
            printf 'export PUBLIC_HOST=%q\n' "$PUBLIC_HOST"
            printf 'export PGHOST=%q\n' "$POSTGRES_HOST"
            printf 'export PGPORT=%q\n' "$POSTGRES_PORT"
            printf 'export PGDATABASE=%q\n' "$POSTGRES_DB"
            printf 'export PGUSER=%q\n' "$POSTGRES_USER"
            printf 'export PGPASSWORD=%q\n' "$POSTGRES_PASSWORD"
            printf 'export OFFSITE_DIR=%q\n' "$OFFSITE_DIR"
            printf 'export ANALYSIS_API_KEY=%q\n' "$ANALYSIS_API_KEY"
            printf 'export OAUTH_CLIENT_ID=%q\n' "$OAUTH_CLIENT_ID"
            printf 'export OAUTH_CLIENT_SECRET=%q\n' "$OAUTH_CLIENT_SECRET"
            printf 'export ADMIN_LOGIN=%q\n' "$ADMIN_LOGIN"
            printf 'export JWT_SIGNING_KEY=%q\n' "$JWT_SIGNING_KEY"
            printf 'export WEBHOOK_SECRET=%q\n' "$WEBHOOK_SECRET"
            printf 'export GITHUB_TOKEN=%q\n' "$GITHUB_INTEGRATION_TOKEN"
            cat <<'REMOTE'
          set -euo pipefail
          for c in dotnet python3 psql pg_dump pg_restore tar sha256sum systemctl; do command -v "$c" >/dev/null || { echo "Missing native prerequisite: $c" >&2; exit 2; }; done
          cd "$DEPLOY_PATH"
          release="$DEPLOY_PATH/releases/$RELEASE_SHA"; backup="$DEPLOY_PATH/backups/predeploy-$RELEASE_SHA"; current_before=""
          [ ! -L current ] || current_before="$(readlink -f current)"
          rm -rf "$release" "$backup"; mkdir -p "$release" "$backup" "$DEPLOY_PATH/data/artifacts" "$DEPLOY_PATH/data/workspaces" "$OFFSITE_DIR"
          cd incoming; sha256sum -c "dip-native-${RELEASE_SHA}.sha256"; cd ..
          tar -xzf "incoming/dip-native-${RELEASE_SHA}.tar.gz" -C "$release"
          (cd "$release" && sha256sum -c SHA256SUMS.txt)
          primary_dev="$(df -P "$DEPLOY_PATH" | tail -1 | awk '{print $1}')"; offsite_dev="$(df -P "$OFFSITE_DIR" | tail -1 | awk '{print $1}')"
          [ "$primary_dev" != "$offsite_dev" ] || { echo 'Offsite backup must be on a different filesystem.' >&2; exit 3; }
          if [ -n "$current_before" ]; then printf '%s\n' "$current_before" > "$backup/previous-release.txt"; fi
          pg_dump -Fc -f "$backup/database.dump"
          pg_restore --list "$backup/database.dump" >/dev/null
          tar -czf "$backup/artifacts.tar.gz" -C "$DEPLOY_PATH/data/artifacts" .
          (cd "$backup" && sha256sum database.dump artifacts.tar.gz > SHA256SUMS)
          off_tmp="$OFFSITE_DIR/predeploy-${RELEASE_SHA}.tmp"; off_final="$OFFSITE_DIR/predeploy-${RELEASE_SHA}"; rm -rf "$off_tmp" "$off_final"; cp -a "$backup" "$off_tmp"; (cd "$off_tmp" && sha256sum -c SHA256SUMS); mv "$off_tmp" "$off_final"
          python3 -m venv "$release/python-analysis/.venv"
          "$release/python-analysis/.venv/bin/python" -m pip install --disable-pip-version-check -r "$release/python-analysis/requirements.txt"
          chmod +x "$release/dip-migrate"
          envfile="$DEPLOY_PATH/deploy.env"; umask 077
          cat > "$envfile" <<ENV
          ASPNETCORE_ENVIRONMENT=Production
          DOTNET_ENVIRONMENT=Production
          ConnectionStrings__PostgreSql=Host=$PGHOST;Port=$PGPORT;Database=$PGDATABASE;Username=$PGUSER;Password=$PGPASSWORD
          Authentication__RequireAuthenticatedUser=true
          PublicAccess__ReadOnly=true
          Authentication__GitHub__ClientId=$OAUTH_CLIENT_ID
          Authentication__GitHub__ClientSecret=$OAUTH_CLIENT_SECRET
          Authentication__GitHub__AdminLogins__0=$ADMIN_LOGIN
          Authentication__Jwt__Issuer=development-intelligence-platform
          Authentication__Jwt__Audience=development-intelligence-platform
          Authentication__Jwt__SigningKey=$JWT_SIGNING_KEY
          Authentication__Jwt__LifetimeMinutes=60
          Authentication__WebCallbackUrl=https://$PUBLIC_HOST/auth/callback
          GitHub__WebhookSecret=$WEBHOOK_SECRET
          GitHub__Token=$GITHUB_TOKEN
          AnalysisService__BaseUrl=http://127.0.0.1:8100
          AnalysisService__ApiKey=$ANALYSIS_API_KEY
          AnalysisService__TimeoutSeconds=30
          API_KEY=$ANALYSIS_API_KEY
          Qa__WorkspaceRoot=$DEPLOY_PATH/data/workspaces
          Qa__ArtifactRoot=$DEPLOY_PATH/data/qa
          Qa__SandboxEnabled=true
          Qa__RequireExternalNetworkIsolation=true
          Qa__RequireExternalFilesystemIsolation=true
          Artifacts__Provider=Local
          Artifacts__LocalRoot=$DEPLOY_PATH/data/artifacts
          SystemStatus__WorkerMetricsUrl=http://127.0.0.1:9091/metrics
          OperationalMetrics__Port=9091
          Api__BaseUrl=http://127.0.0.1:5080/
          Api__PublicBaseUrl=https://$PUBLIC_HOST/
          Ui__PublicWebUrl=https://$PUBLIC_HOST
          Ui__PublicApiUrl=https://$PUBLIC_HOST
          ENV
          "$release/dip-migrate" --connection "Host=$PGHOST;Port=$PGPORT;Database=$PGDATABASE;Username=$PGUSER;Password=$PGPASSWORD"
          ln -sfn "$release" current
          units="$HOME/.config/systemd/user"; mkdir -p "$units"
          cat > "$units/dip-api.service" <<UNIT
          [Unit]
          Description=DIP API
          After=network.target
          [Service]
          WorkingDirectory=$DEPLOY_PATH/current/api
          EnvironmentFile=$envfile
          EnvironmentFile=-$DEPLOY_PATH/host-overrides.env
          ExecStart=$(command -v dotnet) $DEPLOY_PATH/current/api/Dip.Api.dll --urls http://127.0.0.1:5080
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          [Install]
          WantedBy=default.target
          UNIT
          cat > "$units/dip-worker.service" <<UNIT
          [Unit]
          Description=DIP Worker
          After=network.target
          [Service]
          WorkingDirectory=$DEPLOY_PATH/current/worker
          EnvironmentFile=$envfile
          EnvironmentFile=-$DEPLOY_PATH/host-overrides.env
          ExecStart=$(command -v dotnet) $DEPLOY_PATH/current/worker/Dip.Worker.dll
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          [Install]
          WantedBy=default.target
          UNIT
          cat > "$units/dip-web.service" <<UNIT
          [Unit]
          Description=DIP Web
          After=dip-api.service
          [Service]
          WorkingDirectory=$DEPLOY_PATH/current/web
          EnvironmentFile=$envfile
          EnvironmentFile=-$DEPLOY_PATH/host-overrides.env
          ExecStart=$(command -v dotnet) $DEPLOY_PATH/current/web/Dip.Web.dll --urls http://127.0.0.1:5081
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          [Install]
          WantedBy=default.target
          UNIT
          cat > "$units/dip-analysis.service" <<UNIT
          [Unit]
          Description=DIP Python Analysis
          After=network.target
          [Service]
          WorkingDirectory=$DEPLOY_PATH/current/python-analysis
          EnvironmentFile=$envfile
          EnvironmentFile=-$DEPLOY_PATH/host-overrides.env
          ExecStart=$DEPLOY_PATH/current/python-analysis/.venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8100
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          [Install]
          WantedBy=default.target
          UNIT
          systemctl --user daemon-reload
          systemctl --user enable dip-analysis dip-api dip-worker dip-web >/dev/null
          systemctl --user restart dip-analysis dip-api dip-worker dip-web
          printf '%s\n' "$RELEASE_SHA" > "$DEPLOY_PATH/current-release-sha"
          REMOTE
          } | ssh "$remote" "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_SHA='$GITHUB_SHA' bash -s"
      - name: Verify public readiness
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DIP_LIVE_DEPLOY_ENABLED == 'true')
        run: |
          curl --fail --silent --show-error --retry 40 --retry-delay 5 --retry-all-errors "https://$PUBLIC_HOST/healthz" > /tmp/ready.json
          python -c 'import json; d=json.load(open("/tmp/ready.json")); assert d["ready"] is True, d'
          curl --fail --silent --show-error "https://$PUBLIC_HOST/" >/dev/null
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DIP_LIVE_DEPLOY_ENABLED == 'true')
        with: { node-version: "22" }
      - name: Verify public browser
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DIP_LIVE_DEPLOY_ENABLED == 'true')
        working-directory: tests/Dip.UiE2E
        env: { DIP_WEB_BASE_URL: "https://${{ vars.DIP_PUBLIC_HOST }}" }
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:public
      - name: Roll back native deployment on failure
        if: failure() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DIP_LIVE_DEPLOY_ENABLED == 'true'))
        continue-on-error: true
        shell: bash
        run: |
          {
            printf 'export PGHOST=%q\n' "$POSTGRES_HOST"
            printf 'export PGPORT=%q\n' "$POSTGRES_PORT"
            printf 'export PGDATABASE=%q\n' "$POSTGRES_DB"
            printf 'export PGUSER=%q\n' "$POSTGRES_USER"
            printf 'export PGPASSWORD=%q\n' "$POSTGRES_PASSWORD"
            cat <<'REMOTE'
          set -euo pipefail
          backup="$DEPLOY_PATH/backups/predeploy-$RELEASE_SHA"; [ -f "$backup/SHA256SUMS" ] || exit 10
          (cd "$backup" && sha256sum -c SHA256SUMS)
          systemctl --user stop dip-web dip-worker dip-api dip-analysis || true
          psql -d postgres -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='${PGDATABASE}' AND pid<>pg_backend_pid();"
          psql -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS \"${PGDATABASE}\";"
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${PGDATABASE}\" OWNER \"${PGUSER}\";"
          pg_restore -d "$PGDATABASE" --clean --if-exists --no-owner --no-privileges "$backup/database.dump"
          rm -rf "$DEPLOY_PATH/data/artifacts"; mkdir -p "$DEPLOY_PATH/data/artifacts"; tar -xzf "$backup/artifacts.tar.gz" -C "$DEPLOY_PATH/data/artifacts"
          if [ -f "$backup/previous-release.txt" ]; then ln -sfn "$(cat "$backup/previous-release.txt")" "$DEPLOY_PATH/current"; systemctl --user restart dip-analysis dip-api dip-worker dip-web; fi
          REMOTE
          } | ssh "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_SHA='$GITHUB_SHA' bash -s"
