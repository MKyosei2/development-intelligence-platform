name: Portfolio Publication Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".portfolio-ci-trigger"

permissions:
  contents: read

concurrency:
  group: portfolio-publication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-static:
    name: Publication safety and exact-revision static evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Purpose tooling regression
        shell: pwsh
        run: ./scripts/Test-SourcePurposeTooling.ps1

      - name: Verify source readability
        shell: pwsh
        run: |
          ./scripts/Verify-SourceReadability.ps1 `
            -Strict `
            -ReportPath artifacts/source-readability/report.md `
            -InventoryPath artifacts/source-readability/inventory.csv

      - name: Publication safety
        run: python tools/verify_publication_safety.py --root . --output artifacts/publication-safety/publication-safety.json

      - name: Portfolio readiness
        run: python tools/validate_portfolio_readiness.py --root . --output artifacts/portfolio-readiness/static.json

      - name: Validate Actions and source-mutation policy
        run: python tools/verify_actions_policy.py

      - name: Reject obsolete source-mutating workflow files
        shell: python
        run: |
          from pathlib import Path
          obsolete = [
              Path('.github/workflows/normalize-purpose-once.yml'),
              Path('scripts/Apply-PortfolioPurposeComments.ps1'),
          ]
          present = [str(path) for path in obsolete if path.exists()]
          if present:
              raise SystemExit('Obsolete one-shot/source-mutating files must be deleted: ' + ', '.join(present))
          print('PASS: obsolete source mutation files are absent.')

      - name: Parse critical PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'scripts/Invoke-ManualCI.ps1',
            'scripts/Request-FinalVerification.ps1',
            'scripts/Complete-PortfolioRelease.ps1',
            'scripts/Run-PortfolioBenchmarks.ps1',
            'scripts/Run-GovernanceLoadTest.ps1',
            'scripts/SourcePurposeRules.ps1',
            'scripts/Test-SourcePurposeTooling.ps1',
            'scripts/Repair-SourcePurposeComments.ps1',
            'scripts/Verify-SourceReadability.ps1',
            'scripts/DIP_QA_BUG_ZOO_DETERMINISM.ps1',
            'scripts/Package-PortfolioEvidence.ps1'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required PowerShell script is missing: $file"
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $detail = ($errors | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }) -join '; '
              throw "PowerShell parser failure in ${file}: $detail"
            }
            Write-Host "PARSER PASS: $file"
          }

      - name: Validate final-evidence tooling exists and compiles
        shell: python
        run: |
          import py_compile
          from pathlib import Path

          required = [
              "tools/verify_final_ci_matrix.py",
              "tools/publish_qa_scenario_evidence.py",
              "tools/finalize_portfolio_evidence.py",
              "scripts/Complete-PortfolioRelease.ps1",
              "scripts/DIP_QA_BUG_ZOO_DETERMINISM.ps1",
              "scripts/Package-PortfolioEvidence.ps1",
              "docs/09-portfolio/ENGINEERING_JOURNEY.md",
              "docs/09-portfolio/CI_EXECUTION_POLICY.md",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("Final portfolio contract is missing: " + ", ".join(missing))

          for path in [value for value in required if value.endswith(".py")]:
              py_compile.compile(path, doraise=True)
          print("PASS: final-evidence tooling and reviewer documents are present.")

      - name: Validate reviewer-facing capability contract
        shell: python
        run: |
          from pathlib import Path
          text = Path("README.md").read_text(encoding="utf-8")
          required = [
              "Project Truth / Evidence",
              "Game Development QA",
              "Verification / Release Operations",
              "Historical PASS ≠ Current Revision PASS",
              "Fast / Targeted / Full",
              "Policy Verified",
              "Production Deployed",
              "sample-data preview",
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit("README capability/verification contract is incomplete: " + ", ".join(missing))
          size = Path("README.md").stat().st_size
          if size > 12000:
              raise SystemExit(f"README exceeds readiness budget: {size} bytes > 12000")
          print(f"PASS: reviewer-facing contract is complete; README={size} bytes.")

      - name: Generate exact-revision evidence artifact
        shell: python
        env:
          DIP_EXACT_SHA: ${{ github.sha }}
          DIP_REF: ${{ github.ref }}
          DIP_EVENT: ${{ github.event_name }}
          DIP_RUN_ID: ${{ github.run_id }}
          DIP_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path("artifacts/portfolio-readiness")
          out.mkdir(parents=True, exist_ok=True)
          payload = {
              "schema": "dip.exact-revision.static.v2",
              "revision": os.environ["DIP_EXACT_SHA"],
              "ref": os.environ["DIP_REF"],
              "event": os.environ["DIP_EVENT"],
              "runId": os.environ["DIP_RUN_ID"],
              "runAttempt": os.environ["DIP_RUN_ATTEMPT"],
              "generatedAtUtc": datetime.now(timezone.utc).isoformat(),
              "publicationSafety": "PASS",
              "portfolioStaticReadiness": "PASS",
              "runtimeVerified": False,
              "engineRuntime": {"unity": "NOT_EVALUATED", "unreal": "NOT_EVALUATED"},
              "note": "Static readiness is separate from runtime/performance evidence. Final release binds CI, benchmark, QA Bug Zoo and Project Truth scenario evidence to the same SHA; engine runtime is not claimed without a real target project.",
          }
          (out / "exact-revision.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          (out / "exact-revision.md").write_text(
              "# Exact revision static evidence\n\n"
              f"- Revision: `{payload['revision']}`\n"
              f"- Event: `{payload['event']}`\n"
              f"- Ref: `{payload['ref']}`\n"
              f"- Publication safety: **PASS**\n"
              f"- Portfolio static readiness: **PASS**\n"
              f"- Runtime verified by this workflow: **NO**\n"
              f"- Unity runtime: **NOT_EVALUATED**\n"
              f"- Unreal runtime: **NOT_EVALUATED**\n\n"
              "Final runtime/performance evidence is produced separately and must carry the same final SHA.\n",
              encoding="utf-8",
          )

      - name: Upload static evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-publication-readiness-${{ github.sha }}
          path: |
            artifacts/publication-safety/publication-safety.json
            artifacts/portfolio-readiness/static.json
            artifacts/portfolio-readiness/exact-revision.json
            artifacts/portfolio-readiness/exact-revision.md
            artifacts/source-readability/report.md
            artifacts/source-readability/inventory.csv
          if-no-files-found: warn
          retention-days: 3
