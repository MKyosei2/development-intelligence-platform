name: Portfolio Publication Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".portfolio-ci-trigger"

permissions:
  contents: read

concurrency:
  group: portfolio-publication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-static:
    name: Publication safety and exact-revision static evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publication safety
        run: python tools/verify_publication_safety.py --root . --output artifacts/publication-safety/publication-safety.json

      - name: Portfolio readiness
        run: python tools/validate_portfolio_readiness.py --root . --output artifacts/portfolio-readiness/static.json

      - name: Validate three-stage Actions policy
        run: python tools/verify_actions_policy.py

      - name: Validate final-evidence tooling exists and compiles
        shell: python
        run: |
          import py_compile
          from pathlib import Path

          required = [
              "tools/verify_final_ci_matrix.py",
              "tools/verify_unity_real_project.py",
              "tools/verify_unreal_real_project.py",
              "tools/publish_real_project_evidence.py",
              "tools/finalize_portfolio_evidence.py",
              "scripts/Request-FinalVerification.ps1",
              "scripts/Complete-PortfolioRelease.ps1",
              "docs/09-portfolio/REAL_PROJECT_CASE_STUDY.md",
              "docs/09-portfolio/REAL_PROJECT_DEMO.md",
              "docs/09-portfolio/ENGINEERING_JOURNEY.md",
              "docs/09-portfolio/CI_EXECUTION_POLICY.md",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("Final portfolio contract is missing: " + ", ".join(missing))

          for path in [value for value in required if value.endswith(".py")]:
              py_compile.compile(path, doraise=True)
          print("PASS: final-evidence tooling and reviewer documents are present.")

      - name: Validate reviewer-facing capability contract
        shell: python
        run: |
          from pathlib import Path
          text = Path("README.md").read_text(encoding="utf-8")
          required = [
              "Project Truth / Evidence",
              "Game Development QA",
              "Verification / Release Operations",
              "Historical PASS ≠ Current Revision PASS",
              "MAYAtoUnity",
              "Fast / Targeted / Full",
              "Policy Verified",
              "Production Deployed",
              "sample-data preview",
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit("README capability/verification contract is incomplete: " + ", ".join(missing))
          print("PASS: reviewer-facing three-pillar, real-project, CI and deployment boundaries are present.")

      - name: Generate exact-revision evidence artifact
        shell: python
        env:
          DIP_EXACT_SHA: ${{ github.sha }}
          DIP_REF: ${{ github.ref }}
          DIP_EVENT: ${{ github.event_name }}
          DIP_RUN_ID: ${{ github.run_id }}
          DIP_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path("artifacts/portfolio-readiness")
          out.mkdir(parents=True, exist_ok=True)
          payload = {
              "schema": "dip.exact-revision.static.v1",
              "revision": os.environ["DIP_EXACT_SHA"],
              "ref": os.environ["DIP_REF"],
              "event": os.environ["DIP_EVENT"],
              "runId": os.environ["DIP_RUN_ID"],
              "runAttempt": os.environ["DIP_RUN_ATTEMPT"],
              "generatedAtUtc": datetime.now(timezone.utc).isoformat(),
              "publicationSafety": "PASS",
              "portfolioStaticReadiness": "PASS",
              "runtimeVerified": False,
              "note": "Runtime verification is intentionally separate. Final release requires real Unity/Unreal and benchmark evidence bound to this same SHA.",
          }
          (out / "exact-revision.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          (out / "exact-revision.md").write_text(
              "# Exact revision static evidence\n\n"
              f"- Revision: `{payload['revision']}`\n"
              f"- Event: `{payload['event']}`\n"
              f"- Ref: `{payload['ref']}`\n"
              f"- Publication safety: **PASS**\n"
              f"- Portfolio static readiness: **PASS**\n"
              f"- Runtime verified by this workflow: **NO**\n\n"
              "Runtime/engine/performance evidence is intentionally separate and must carry the same final SHA.\n",
              encoding="utf-8",
          )

      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-publication-readiness-${{ github.sha }}
          path: |
            artifacts/publication-safety/publication-safety.json
            artifacts/portfolio-readiness/static.json
            artifacts/portfolio-readiness/exact-revision.json
            artifacts/portfolio-readiness/exact-revision.md
          if-no-files-found: warn
          retention-days: 30
