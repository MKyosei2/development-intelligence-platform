name: Portfolio Publication Readiness
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portfolio-static:
    name: Publication safety and portfolio static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publication safety
        run: python tools/verify_publication_safety.py --root . --output artifacts/publication-safety/publication-safety.json
      - name: Portfolio readiness
        run: python tools/validate_portfolio_readiness.py --root . --output artifacts/portfolio-readiness/static.json
      - name: Reject zero-step evidence claims
        run: |
          grep -q "Historical verified baseline" README.md
          grep -q "not automatically attributed to newer commits" README.md
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-publication-readiness
          path: |
            artifacts/publication-safety/publication-safety.json
            artifacts/portfolio-readiness/static.json
          retention-days: 30
