name: Unreal Collector CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".portfolio-ci-trigger"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile collector
        run: python -m compileall collectors/unreal-collector
      - name: Unit tests
        run: python -m unittest discover -s collectors/unreal-collector/tests -v
      - name: Hosted-CI boundary
        shell: bash
        run: |
          echo "Hosted CI validates collector code only."
          echo "Actual UnrealEditor-Cmd runtime evidence is required separately for the final SHA."
