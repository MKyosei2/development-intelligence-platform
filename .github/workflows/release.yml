name: Release
on:
  workflow_dispatch:
    inputs:
      version: { description: "Version without leading v", required: true, type: string }
permissions: { contents: write }
jobs:
  release:
    name: Verify and publish native release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 2
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "8.0.x" }
      - name: Publication gate
        run: |
          python tools/verify_publication_safety.py --root . --output artifacts/publication-safety/publication-safety.json
          python tools/validate_portfolio_readiness.py --root . --output artifacts/portfolio-readiness/static.json
          dotnet restore DevelopmentIntelligencePlatform.sln
          dotnet build DevelopmentIntelligencePlatform.sln -c Release --no-restore
          dotnet test tests/Dip.Domain.Tests/Dip.Domain.Tests.csproj -c Release --no-build
          dotnet test tests/Dip.Application.Tests/Dip.Application.Tests.csproj -c Release --no-build
          dotnet test tests/Dip.Infrastructure.Tests/Dip.Infrastructure.Tests.csproj -c Release --no-build
      - name: Publish native bundle
        run: |
          mkdir -p artifacts/native
          dotnet publish src/Dip.Api/Dip.Api.csproj -c Release -o artifacts/native/api -p:Version=${{ steps.version.outputs.value }} --no-restore
          dotnet publish src/Dip.Web/Dip.Web.csproj -c Release -o artifacts/native/web -p:Version=${{ steps.version.outputs.value }} --no-restore
          dotnet publish src/Dip.Worker/Dip.Worker.csproj -c Release -o artifacts/native/worker -p:Version=${{ steps.version.outputs.value }} --no-restore
          cp -a services/python-analysis artifacts/native/python-analysis
          cp -a scripts deploy artifacts/native/
          dotnet tool restore
          dotnet ef migrations bundle --project src/Dip.Infrastructure --startup-project src/Dip.Api -c Release -o artifacts/native/dip-migrate
          (cd artifacts/native && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          tar -czf artifacts/dip-native-${{ steps.version.outputs.value }}.tar.gz -C artifacts/native .
          sha256sum artifacts/dip-native-${{ steps.version.outputs.value }}.tar.gz > artifacts/SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/dip-native-${{ steps.version.outputs.value }}.tar.gz
            artifacts/SHA256SUMS.txt
            artifacts/publication-safety/publication-safety.json
            artifacts/portfolio-readiness/static.json
