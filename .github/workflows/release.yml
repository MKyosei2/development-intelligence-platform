name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore DevelopmentIntelligencePlatform.sln
      - name: Test
        run: dotnet test DevelopmentIntelligencePlatform.sln --configuration Release
      - name: Publish services
        run: |
          dotnet publish src/Dip.Api/Dip.Api.csproj -c Release -o artifacts/api -p:Version=${{ steps.version.outputs.value }}
          dotnet publish src/Dip.Web/Dip.Web.csproj -c Release -o artifacts/web -p:Version=${{ steps.version.outputs.value }}
          dotnet publish src/Dip.Worker/Dip.Worker.csproj -c Release -o artifacts/worker -p:Version=${{ steps.version.outputs.value }}
      - name: Package artifacts
        run: |
          cd artifacts
          zip -r dip-api-${{ steps.version.outputs.value }}.zip api
          zip -r dip-web-${{ steps.version.outputs.value }}.zip web
          zip -r dip-worker-${{ steps.version.outputs.value }}.zip worker
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            artifacts/dip-api-${{ steps.version.outputs.value }}.zip
            artifacts/dip-web-${{ steps.version.outputs.value }}.zip
            artifacts/dip-worker-${{ steps.version.outputs.value }}.zip
