name: Universal QA Benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".portfolio-ci-trigger"
permissions:
  contents: read
jobs:
  measured-toolchain-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install TypeScript
        run: npm install --global typescript
      - name: Run measured Universal QA toolchain benchmark
        run: python tools/universal_qa_benchmark.py --output artifacts/universal-qa-benchmark
      - name: Verify measured benchmark evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/universal-qa-benchmark/universal-qa-benchmark-results.json
          test -s artifacts/universal-qa-benchmark/universal-qa-benchmark-results.sha256
          cd artifacts/universal-qa-benchmark
          sha256sum -c universal-qa-benchmark-results.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('universal-qa-benchmark-results.json').read_text(encoding='utf-8'))
          assert value['cases'] > 0
          assert value['falsePositiveRatePercent'] == 0
          assert value['falseNegativeRatePercent'] == 0
          assert value['reproductionRatePercent'] == 100
          print('PASS: measured benchmark result is complete and internally consistent.')
          PY
      - name: Upload measured evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: universal-qa-benchmark-${{ github.sha }}
          path: artifacts/universal-qa-benchmark
          if-no-files-found: warn
          retention-days: 3
