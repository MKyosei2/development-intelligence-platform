name: development-intelligence-platform-web

services:
  postgres:
    image: ${DIP_POSTGRES_IMAGE:?Set a digest-pinned PostgreSQL image in deploy/web.env}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dip}
      POSTGRES_USER: ${POSTGRES_USER:-dip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/web.env}
    volumes:
      - dip-web-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dip} -d ${POSTGRES_DB:-dip}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]

  redis:
    image: ${DIP_REDIS_IMAGE:?Set a digest-pinned Redis image in deploy/web.env}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${DIP_REDIS_PASSWORD:?Set DIP_REDIS_PASSWORD in deploy/web.env}
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    volumes:
      - dip-web-redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  python-analysis:
    image: ${DIP_IMAGE_PREFIX:-ghcr.io/mkyosei2/dip}-analysis:${DIP_IMAGE_TAG:?Set exact source SHA in deploy/web.env}
    build:
      context: .
      dockerfile: infrastructure/docker/analysis.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: ${ANALYSIS_LOG_LEVEL:-INFO}
      API_KEY: ${DIP_ANALYSIS_API_KEY:?Set DIP_ANALYSIS_API_KEY in deploy/web.env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]

  api:
    image: ${DIP_IMAGE_PREFIX:-ghcr.io/mkyosei2/dip}-api:${DIP_IMAGE_TAG:?Set exact source SHA in deploy/web.env}
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Hosting__UseHttpsRedirection: "false"
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-dip};Username=${POSTGRES_USER:-dip};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/web.env}
      Redis__ConnectionString: redis:6379,password=${DIP_REDIS_PASSWORD:?Set DIP_REDIS_PASSWORD in deploy/web.env},abortConnect=false
      Redis__InstanceName: "dip:"
      AnalysisService__BaseUrl: http://python-analysis:8100
      AnalysisService__TimeoutSeconds: ${ANALYSIS_TIMEOUT_SECONDS:-30}
      AnalysisService__ApiKey: ${DIP_ANALYSIS_API_KEY:?Set DIP_ANALYSIS_API_KEY in deploy/web.env}
      GitHub__WebhookSecret: ${DIP_GITHUB_WEBHOOK_SECRET:?Set DIP_GITHUB_WEBHOOK_SECRET in deploy/web.env}
      GitHub__Token: ${DIP_GITHUB_TOKEN:-}
      GitHub__AppId: ${DIP_GITHUB_APP_ID:-0}
      GitHub__InstallationId: ${DIP_GITHUB_APP_INSTALLATION_ID:-0}
      GitHub__AppSlug: ${DIP_GITHUB_APP_SLUG:-}
      GitHub__AppPrivateKeyBase64: ${DIP_GITHUB_APP_PRIVATE_KEY_BASE64:-}
      Qa__WorkspaceRoot: /data/dip-workspaces
      Qa__SandboxEnabled: "true"
      Qa__RequireExternalNetworkIsolation: "true"
      Qa__RequireExternalFilesystemIsolation: "true"
      Artifacts__Provider: Local
      Artifacts__LocalRoot: /data/dip-artifacts
      Authentication__RequireAuthenticatedUser: "true"
      PublicAccess__ReadOnly: ${DIP_PUBLIC_READ_ONLY:-true}
      Authentication__GitHub__ClientId: ${DIP_GITHUB_OAUTH_CLIENT_ID:?Set DIP_GITHUB_OAUTH_CLIENT_ID in deploy/web.env}
      Authentication__GitHub__ClientSecret: ${DIP_GITHUB_OAUTH_CLIENT_SECRET:?Set DIP_GITHUB_OAUTH_CLIENT_SECRET in deploy/web.env}
      Authentication__GitHub__AdminLogins__0: ${DIP_GITHUB_ADMIN_LOGIN:?Set DIP_GITHUB_ADMIN_LOGIN in deploy/web.env}
      Authentication__WebCallbackUrl: https://${DIP_PUBLIC_HOST:?Set DIP_PUBLIC_HOST in deploy/web.env}/auth/callback
      Authentication__Jwt__Issuer: development-intelligence-platform
      Authentication__Jwt__Audience: development-intelligence-platform
      Authentication__Jwt__SigningKey: ${DIP_JWT_SIGNING_KEY:?Set a 64+ character DIP_JWT_SIGNING_KEY in deploy/web.env}
      Authentication__Jwt__LifetimeMinutes: ${DIP_JWT_LIFETIME_MINUTES:-60}
      SystemStatus__WorkerMetricsUrl: http://worker:9091/metrics
      OpenTelemetry__OtlpEndpoint: ${DIP_OTLP_ENDPOINT:-http://127.0.0.1:4317}
      ExternalEventIngestion__IngestKey: ${DIP_EXTERNAL_EVENT_INGEST_KEY:-}
      WorkItems__Jira__BaseUrl: ${DIP_JIRA_BASE_URL:-}
      WorkItems__Jira__Email: ${DIP_JIRA_EMAIL:-}
      WorkItems__Jira__ApiToken: ${DIP_JIRA_API_TOKEN:-}
      WorkItems__Jira__ProjectKey: ${DIP_JIRA_PROJECT_KEY:-}
      WorkItems__Linear__ApiKey: ${DIP_LINEAR_API_KEY:-}
      WorkItems__Linear__TeamId: ${DIP_LINEAR_TEAM_ID:-}
      P2Intelligence__AiEndpoint: ${DIP_AI_ENDPOINT:-}
      P2Intelligence__AiApiKey: ${DIP_AI_API_KEY:-}
      P2Intelligence__AiModel: ${DIP_AI_MODEL:-evidence-grounded-model}
      P2Intelligence__AllowExternalAi: ${DIP_ALLOW_EXTERNAL_AI:-false}
      P2Intelligence__AllowFixProposal: ${DIP_ALLOW_FIX_PROPOSAL:-false}
      ProjectIntelligenceSources__Redmine__BaseUrl: ${DIP_REDMINE_BASE_URL:-}
      ProjectIntelligenceSources__Redmine__ApiKey: ${DIP_REDMINE_API_KEY:-}
      ProjectIntelligenceSources__Redmine__ProjectIdentifier: ${DIP_REDMINE_PROJECT_IDENTIFIER:-}
      ProjectIntelligenceSources__Slack__BotToken: ${DIP_SLACK_SOURCE_BOT_TOKEN:-}
      ProjectIntelligenceSources__Slack__SigningSecret: ${DIP_SLACK_SIGNING_SECRET:-}
      ProjectIntelligenceSources__Slack__ChannelIds__0: ${DIP_SLACK_SOURCE_CHANNEL_0:-}
      ProjectIntelligenceSources__Teams__IngestKey: ${DIP_TEAMS_EVIDENCE_INGEST_KEY:-}
    volumes:
      - dip-web-artifacts:/data/dip-artifacts
      - dip-web-workspaces:/data/dip-workspaces
      - dip-api-dataprotection:/home/dipuser/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-analysis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [backend]

  worker:
    image: ${DIP_IMAGE_PREFIX:-ghcr.io/mkyosei2/dip}-worker:${DIP_IMAGE_TAG:?Set exact source SHA in deploy/web.env}
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-dip};Username=${POSTGRES_USER:-dip};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/web.env}
      Redis__ConnectionString: redis:6379,password=${DIP_REDIS_PASSWORD:?Set DIP_REDIS_PASSWORD in deploy/web.env},abortConnect=false
      Redis__InstanceName: "dip:"
      AnalysisService__BaseUrl: http://python-analysis:8100
      AnalysisService__TimeoutSeconds: ${ANALYSIS_TIMEOUT_SECONDS:-30}
      AnalysisService__ApiKey: ${DIP_ANALYSIS_API_KEY:?Set DIP_ANALYSIS_API_KEY in deploy/web.env}
      GitHub__Token: ${DIP_GITHUB_TOKEN:-}
      GitHub__AppId: ${DIP_GITHUB_APP_ID:-0}
      GitHub__InstallationId: ${DIP_GITHUB_APP_INSTALLATION_ID:-0}
      GitHub__AppSlug: ${DIP_GITHUB_APP_SLUG:-}
      GitHub__AppPrivateKeyBase64: ${DIP_GITHUB_APP_PRIVATE_KEY_BASE64:-}
      Qa__WorkspaceRoot: /data/dip-workspaces
      Qa__SandboxEnabled: "true"
      Qa__RequireExternalNetworkIsolation: "true"
      Qa__RequireExternalFilesystemIsolation: "true"
      # The executor additionally requires DIP_QA_NETWORK_ISOLATED=1 at runtime.
      # This deployment intentionally does not self-assert that signal: an external
      # sandbox/container runner must attest it, otherwise untrusted QA fails closed.
      Artifacts__Provider: Local
      Artifacts__LocalRoot: /data/dip-artifacts
      OperationalMetrics__Port: 9091
      AutomaticTriage__IntervalSeconds: ${DIP_AUTOMATIC_TRIAGE_INTERVAL_SECONDS:-30}
      GameReplay__WorkspaceRoot: /app
      GameReplay__AllowPathLookup: ${DIP_REPLAY_ALLOW_PATH_LOOKUP:-false}
      ReleaseProvenance__AllowedRoot: /app
      OpenTelemetry__OtlpEndpoint: ${DIP_OTLP_ENDPOINT:-http://127.0.0.1:4317}
      ManagementNotifications__Enabled: ${DIP_MANAGEMENT_NOTIFICATIONS_ENABLED:-true}
      ManagementNotifications__ScanIntervalSeconds: ${DIP_MANAGEMENT_NOTIFICATION_SCAN_SECONDS:-60}
      ManagementNotifications__SlackWebhookUrl: ${DIP_SLACK_WEBHOOK_URL:-}
      ManagementNotifications__TeamsWebhookUrl: ${DIP_TEAMS_WEBHOOK_URL:-}
      ManagementNotifications__Email__Host: ${DIP_SMTP_HOST:-}
      ManagementNotifications__Email__Port: ${DIP_SMTP_PORT:-587}
      ManagementNotifications__Email__EnableSsl: ${DIP_SMTP_ENABLE_SSL:-true}
      ManagementNotifications__Email__Username: ${DIP_SMTP_USERNAME:-}
      ManagementNotifications__Email__Password: ${DIP_SMTP_PASSWORD:-}
      ManagementNotifications__Email__From: ${DIP_SMTP_FROM:-}
      ManagementNotifications__Email__To: ${DIP_MANAGEMENT_EMAIL_TO:-}
    volumes:
      - dip-web-artifacts:/data/dip-artifacts
      - dip-web-workspaces:/data/dip-workspaces
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  web:
    image: ${DIP_IMAGE_PREFIX:-ghcr.io/mkyosei2/dip}-web:${DIP_IMAGE_TAG:?Set exact source SHA in deploy/web.env}
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080/
      Api__PublicBaseUrl: https://${DIP_PUBLIC_HOST:?Set DIP_PUBLIC_HOST in deploy/web.env}/
      Ui__PublicWebUrl: https://${DIP_PUBLIC_HOST:?Set DIP_PUBLIC_HOST in deploy/web.env}
      Ui__PublicApiUrl: https://${DIP_PUBLIC_HOST:?Set DIP_PUBLIC_HOST in deploy/web.env}
      Authentication__RequireAuthenticatedUser: "true"
      PublicAccess__ReadOnly: ${DIP_PUBLIC_READ_ONLY:-true}
    volumes:
      - dip-web-dataprotection:/home/dipuser/.aspnet/DataProtection-Keys
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  caddy:
    image: ${DIP_CADDY_IMAGE:?Set a digest-pinned Caddy image in deploy/web.env}
    restart: unless-stopped
    environment:
      DIP_PUBLIC_HOST: ${DIP_PUBLIC_HOST:?Set DIP_PUBLIC_HOST in deploy/web.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - dip-caddy-data:/data
      - dip-caddy-config:/config
    depends_on:
      - web
      - api
    networks: [backend]

volumes:
  dip-web-postgres:
  dip-web-redis:
  dip-web-artifacts:
  dip-web-workspaces:
  dip-api-dataprotection:
  dip-web-dataprotection:
  dip-caddy-data:
  dip-caddy-config:

networks:
  backend:
    driver: bridge
