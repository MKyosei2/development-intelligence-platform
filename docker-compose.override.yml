# Local-development overrides for docker-compose.yml.
services:
  postgres:
    logging: &dip-logging
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

  redis:
    logging: *dip-logging
    stop_grace_period: 15s

  python-analysis:
    logging: *dip-logging
    stop_grace_period: 30s

  api:
    logging: *dip-logging
    stop_grace_period: 30s

  worker:
    logging: *dip-logging
    stop_grace_period: 30s

  web:
    logging: *dip-logging
    stop_grace_period: 30s

  minio:
    profiles: ["storage"]
    logging: *dip-logging
    stop_grace_period: 30s

  otel-collector:
    profiles: ["monitoring"]
    logging: *dip-logging
    stop_grace_period: 30s

  prometheus:
    profiles: ["monitoring"]
    logging: *dip-logging
    stop_grace_period: 30s

  grafana:
    profiles: ["monitoring"]
    logging: *dip-logging
    stop_grace_period: 30s
